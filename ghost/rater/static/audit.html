<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ghost in the GPU — Misclick Audit Tool</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<style>


  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg);
    background-image: radial-gradient(rgba(17,17,17,.08) 1.5px, transparent 1.5px);
    background-size: 20px 20px;
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Monaco, Consolas, monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  header {
    background: var(--panel);
    border-bottom: 3px solid var(--ink);
    padding: 8px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand {
    background: var(--ink);
    color: var(--accent);
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: .08em;
    text-transform: uppercase;
  }

  h1 {
    font-size: 14px;
    font-weight: 900;
    color: var(--ink);
    letter-spacing: .02em;
  }

  .back-link {
    background: var(--panel-2);
    border: 2px solid var(--ink);
    color: var(--ink);
    text-decoration: none;
    font-size: 11px;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: 7px;
    box-shadow: 2px 2px 0 var(--ink);
    transition: transform 0.08s, box-shadow 0.08s;
  }

  .back-link:hover {
    transform: translate(-1px, -1px);
    box-shadow: 3px 3px 0 var(--ink);
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 11px;
    font-weight: 700;
  }

  .threshold-control {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--panel-2);
    padding: 3px 8px;
    border-radius: 7px;
    border: 2px solid var(--ink);
    box-shadow: 2px 2px 0 var(--ink);
    font-size: 11px;
  }

  .threshold-control input {
    width: 70px;
    accent-color: var(--ink);
    cursor: pointer;
  }

  .btn {
    padding: 4px 12px;
    border-radius: 7px;
    font-size: 11px;
    font-family: inherit;
    font-weight: 900;
    cursor: pointer;
    border: 2px solid var(--ink);
    box-shadow: 2px 2px 0 var(--ink);
    transition: transform 0.08s, box-shadow 0.08s;
  }

  .btn:hover {
    transform: translate(-1px, -1px);
    box-shadow: 3px 3px 0 var(--ink);
  }

  .btn:active {
    transform: translate(2px, 2px);
    box-shadow: 0 0 0 var(--ink);
  }

  .btn-primary {
    background: var(--accent);
    color: var(--ink);
  }

  main {
    flex: 1;
    max-width: 1400px;
    width: 100%;
    margin: 0 auto;
    padding: 16px;
  }

  .stats-bar {
    margin-bottom: 16px;
    padding: 8px 14px;
    background: var(--panel);
    border: 3px solid var(--ink);
    box-shadow: 4px 4px 0 var(--ink);
    border-radius: var(--radius);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    font-weight: 800;
    color: var(--ink);
  }

  .audit-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .audit-item {
    background: var(--panel);
    border: 3px solid var(--ink);
    box-shadow: 4px 4px 0 var(--ink);
    border-radius: var(--radius);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .audit-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    font-weight: 800;
    color: var(--muted);
  }

  .audit-delta-tag {
    background: #FFE2E6;
    color: var(--dislike);
    border: 2px solid var(--ink);
    box-shadow: 2px 2px 0 var(--ink);
    padding: 2px 8px;
    border-radius: 6px;
    font-weight: 900;
    font-size: 11px;
    letter-spacing: 0.3px;
  }

  .audit-row {
    display: flex;
    gap: 14px;
    align-items: stretch;
    overflow-x: auto;
    padding-bottom: 4px;
  }

  .audit-img-card {
    flex: 1;
    min-width: 200px;
    max-width: 280px;
    background: #111116;
    border: 3px solid var(--ink);
    box-shadow: 3px 3px 0 var(--ink);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }

  .audit-img-card.is-winner {
    border-color: var(--dislike);
    box-shadow: 0 0 0 2px var(--dislike), 4px 4px 0 var(--ink);
  }

  .audit-img-card.is-expected {
    border-color: var(--like);
    box-shadow: 0 0 0 2px var(--like), 4px 4px 0 var(--ink);
  }

  .audit-img-wrap {
    width: 100%;
    height: 240px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #09090c;
  }

  .audit-img-wrap img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  .audit-img-info {
    padding: 8px 10px;
    font-size: 11px;
    font-weight: 800;
    text-align: center;
    width: 100%;
    background: var(--panel-2);
    border-top: 2px solid var(--ink);
    color: var(--ink);
  }

  .audit-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    border-top: 2px solid rgba(17,17,17,0.12);
    padding-top: 10px;
  }

  .btn-flip {
    background: var(--like);
    color: var(--ink);
  }

  .btn-del {
    background: var(--dislike);
    color: #fff;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    font-weight: 800;
  }

  .spinner {
    width: 28px;
    height: 28px;
    border: 4px solid var(--panel-2);
    border-top-color: var(--ink);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
    <!-- 
    ==========================================================================
    NOTE FOR AGENTIC AI / DEVELOPERS:
    Global UI design system tokens, resets, modal, toast, and common button styles
    are centralized in '/static/common.css'.
    When debugging, modifying, or fixing UI/styling issues on this page, 
    ALWAYS inspect and consider '/static/common.css' (ghost/rater/static/common.css) 
    alongside the page-specific <style> block.
    ==========================================================================
  -->
  <link rel="stylesheet" href="/static/common.css">
</head>
<body>
<header>
  <div class="header-left">
    <div class="brand">Ghost in the GPU</div>
    <h1>Audit & Anomaly Tool</h1>
    <a href="/" class="back-link">🏠 Hub</a>
    <a href="/domain" id="domainNavBtn" class="back-link">📂 Workspace</a>
    <a href="/rate" id="rateNavBtn" class="back-link">⚔ Rater</a>
    <a href="/flex" id="flexNavBtn" class="back-link" style="background:var(--accent);">⚡ Flex AI</a>
    <a href="/import" id="importNavBtn" class="back-link">📥 Importer</a>
  </div>
  <div class="controls">
    <div class="threshold-control">
      <label for="domainSel">Domain:</label>
      <select id="domainSel" style="border:none; background:transparent; font-family:inherit; font-size:11px; font-weight:800; cursor:pointer; outline:none;"></select>
    </div>
    <div class="threshold-control">
      <label for="threshRange">Delta &ge; <span id="threshVal">0.35</span>:</label>
      <input type="range" id="threshRange" min="0.20" max="0.80" step="0.05" value="0.35">
    </div>
    <button id="refreshBtn" class="btn btn-primary" onclick="loadAudit()">🔄 Rescan</button>
  </div>
</header>

<main>
  <div id="statsBar" class="stats-bar">
    <span id="statsSummary">Loading comparison database...</span>
    <span style="font-size: 12px; color: #777788;">Evaluated with active PE-Core Taste Vector</span>
  </div>
  <div id="auditList" class="audit-list">
    <div class="empty-state">
      <div class="spinner"></div>
      <p style="color:#888;">Analyzing rating history with trained PE-Core brain...</p>
    </div>
  </div>
</main>

<script>
const threshRange = document.getElementById('threshRange');
const threshVal = document.getElementById('threshVal');
const auditList = document.getElementById('auditList');
const statsSummary = document.getElementById('statsSummary');
const domainSel = document.getElementById('domainSel');

const urlParams = new URLSearchParams(location.search);
const _parsedDomainId = parseInt(urlParams.get('domain_id') || sessionStorage.getItem('ghost_domain_id') || '1', 10);
let activeDomainId = Number.isFinite(_parsedDomainId) && _parsedDomainId > 0 ? _parsedDomainId : 1;
sessionStorage.setItem('ghost_domain_id', String(activeDomainId));

function syncNavLinks() {
  const domBtn = document.getElementById('domainNavBtn');
  if (domBtn) domBtn.href = `/domain?id=${activeDomainId}`;
  document.getElementById('rateNavBtn').href = `/rate?domain_id=${activeDomainId}`;
  document.getElementById('flexNavBtn').href = `/flex?domain_id=${activeDomainId}`;
  document.getElementById('importNavBtn').href = `/import?domain_id=${activeDomainId}`;
}

async function initDomains() {
  syncNavLinks();
  try {
    const res = await fetch('/api/domains');
    const d = await res.json();
    domainSel.innerHTML = '';
    for (const dom of d.domains) {
      const opt = document.createElement('option');
      opt.value = dom.id;
      opt.textContent = dom.name;
      if (dom.id === activeDomainId) opt.selected = true;
      domainSel.appendChild(opt);
    }
    domainSel.onchange = () => {
      activeDomainId = parseInt(domainSel.value, 10);
      sessionStorage.setItem('ghost_domain_id', String(activeDomainId));
      syncNavLinks();
      loadAudit();
    };
  } catch (err) {
    console.warn('Failed to load domains:', err);
    domainSel.innerHTML = '<option value="1">Failed to load</option>';
  }
}

threshRange.oninput = () => {
  threshVal.textContent = parseFloat(threshRange.value).toFixed(2);
};
threshRange.onchange = () => {
  loadAudit();
};

async function loadAudit() {
  const t = threshRange.value;
  auditList.innerHTML = `
    <div class="empty-state">
      <div class="spinner"></div>
      <p style="color:#888;">Analyzing rating history with threshold &ge; ${t}...</p>
    </div>
  `;
  try {
    const res = await fetch(`/api/audit?domain_id=${activeDomainId}&threshold=${t}`);
    if (!res.ok) throw new Error(`Server returned ${res.status}`);
    const data = await res.json();
    if (!data.ok) {
      statsSummary.innerHTML = `<span style="color:#f87171;">⚠️ ${data.msg || 'Failed to scan ratings.'}</span>`;
      auditList.innerHTML = `<div class="empty-state"><p style="color:#f87171;">${data.msg || 'Failed to scan ratings.'}</p></div>`;
      return;
    }

    statsSummary.innerHTML = `Scanned <b>${data.total_comparisons}</b> total ratings · Flagged <b>${data.upsets.length}</b> potential misclicks`;

    if (data.upsets.length === 0) {
      auditList.innerHTML = `
        <div class="empty-state">
          <div style="font-size:42px;margin-bottom:14px;">✨</div>
          <h3 style="color:#10b981;font-size:18px;margin-bottom:8px;">Zero Suspicious Misclicks Found!</h3>
          <p style="color:#888;font-size:14px;max-width:500px;margin:0 auto;">
            All ${data.total_comparisons} ratings in your history match cleanly with your trained PE-Core taste vector at delta threshold &ge; ${t}.
          </p>
        </div>
      `;
      return;
    }

    renderUpsets(data.upsets);
  } catch (e) {
    auditList.innerHTML = `<div class="empty-state"><p style="color:#f87171;">Error: ${e.message}</p></div>`;
  }
}

function renderUpsets(upsets) {
  let html = '';
  upsets.forEach(u => {
    html += `
      <div class="audit-item" id="audit-cmp-${u.comparison_id}">
        <div class="audit-meta">
          <div>
            <b>Comparison #${u.comparison_id}</b>
            <span style="color:#666;margin-left:10px;">${new Date(u.created_at * 1000).toLocaleString()}</span>
          </div>
          <span class="audit-delta-tag">AI Surprise Delta: +${u.max_delta}</span>
        </div>
        <div class="audit-row">
    `;

    u.shown_order.forEach(id => {
      const isWinner = id === u.winner_id;
      const isExpected = id === u.expected_winner_id;
      let scoreVal = null;
      if (isWinner) scoreVal = u.winner_score;
      else {
        const lObj = u.losers.find(x => x.id === id);
        if (lObj) scoreVal = lObj.score;
      }

      html += `
        <div class="audit-img-card ${isWinner ? 'is-winner' : (isExpected ? 'is-expected' : '')}">
          <div class="audit-img-wrap">
            <img src="/api/image/${id}" loading="lazy" />
          </div>
          <div class="audit-img-info">
            <div style="font-weight:600;margin-bottom:4px;">
              ${isWinner ? '<span style="color:#f87171;">⚠️ Clicked Winner</span>' : (isExpected ? '<span style="color:#10b981;">💡 Expected Winner</span>' : '<span style="color:#888;">Loser</span>')}
            </div>
            <div style="color:#999;font-size:12px;">Image #${id} · Score: <b>${scoreVal != null ? scoreVal : 'N/A'}</b></div>
          </div>
        </div>
      `;
    });

    html += `
        </div>
        <div class="audit-actions">
          <button class="btn btn-flip" onclick="flipWinner(${u.comparison_id}, ${u.expected_winner_id})">
            🔄 Flip Winner to Expected (#${u.expected_winner_id})
          </button>
          <button class="btn btn-del" onclick="deleteComparison(${u.comparison_id})">
            🗑️ Delete Comparison
          </button>
        </div>
      </div>
    `;
  });
  auditList.innerHTML = html;
}

async function flipWinner(comparisonId, newWinnerId) {
  if (!confirm(`Change recorded winner of Comparison #${comparisonId} to Image #${newWinnerId}?`)) return;
  try {
    const res = await fetch('/api/audit/flip', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ comparison_id: comparisonId, new_winner_id: newWinnerId })
    });
    const d = await res.json().catch(() => ({}));
    if (!res.ok || !d.ok) {
      alert('Failed to flip winner: ' + (d.detail || d.error || d.msg || `HTTP ${res.status}`));
      return;
    }
    const el = document.getElementById(`audit-cmp-${comparisonId}`);
    if (el) {
      el.style.opacity = '0.3';
      el.innerHTML = `<div style="padding:20px;text-align:center;color:#10b981;font-weight:600;">✓ Comparison #${comparisonId} updated to Winner #${newWinnerId}! (Remember to re-train your Ghost when done)</div>`;
    }
  } catch (e) {
    alert('Error flipping winner: ' + e.message);
  }
}

async function deleteComparison(comparisonId) {
  if (!confirm(`Delete Comparison #${comparisonId} from database?`)) return;
  try {
    const res = await fetch('/api/audit/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ comparison_id: comparisonId })
    });
    const d = await res.json().catch(() => ({}));
    if (!res.ok || !d.ok) {
      alert('Failed to delete comparison: ' + (d.detail || d.error || d.msg || `HTTP ${res.status}`));
      return;
    }
    const el = document.getElementById(`audit-cmp-${comparisonId}`);
    if (el) {
      el.style.opacity = '0.3';
      el.innerHTML = `<div style="padding:20px;text-align:center;color:#f87171;font-weight:600;">✓ Comparison #${comparisonId} deleted from database!</div>`;
    }
  } catch (e) {
    alert('Error deleting comparison: ' + e.message);
  }
}

initDomains();
loadAudit();
</script>
</body>
</html>
